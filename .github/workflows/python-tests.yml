name: Python Tests
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --hardware demo

  # Runs on the lab PC connected to the microscope (a self-hosted runner with the "microscope" label).
  # Runs for pull requests into main (so it can block the merge) and for pushes to main.
  real:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: demo
    runs-on: [ self-hosted, windows, microscope ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --hardware real
