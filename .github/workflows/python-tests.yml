name: Python Tests

# Demo-hardware tests run locally before every push to a non-main branch (see .githooks/pre-push).
# CI only tests on the real microscope: on pull requests into main (to block a bad merge) and on main itself.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Runs on the lab PC connected to the microscope (a self-hosted runner with the "microscope" label).
  real:
    runs-on: [ self-hosted, windows, microscope ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --hardware real
